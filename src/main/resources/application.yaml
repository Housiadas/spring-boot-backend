spring:
  application:
    name: backend-housi
  main:
    keep-alive: true # ensures JVM is kept alive, even if all threads are virtual threads https://docs.spring.io/spring-boot/docs/3.2.0-RC2/reference/htmlsingle/#features.spring-application.virtual-threads
  web:
    resources:
      add-mappings: false # disable static content.
  mvc:
    log-resolved-exception: false # remove tomcat log exception since it is already treated in GlobalExceptionHandler
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost:5432}/${DB_NAME:housi_db}
    username: ${DB_USER:myuser}
    password: ${DB_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:20}
      data-source-properties:
        ApplicationName: ${spring.application.name} # allows to see what applications are connected to the server and what resources they are using through views like pg_stat_activity
        reWriteBatchedInserts: true
        stringtype: unspecified
  jpa:
    open-in-view: false # disables lazy loading in web views, important for performance.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        generate_statistics: false
        jdbc:
          # important: When using GenerationType.IDENTITY Hibernate disable batching, you need to use BatchSequenceGenerator
          batch_size: ${JDBC_BATCH_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
  jwt:
    secret: ${JWT_SECRET:PA11l8EprUzQajXo+7eaL1MPstYnewau/pp7/D3L0Nc=}
    expiration: 900000
#  security:
#    oauth2:
#      resourceserver:
#        jwt:
#          issuer-uri: http://localhost:8000/realms/api
#          jwk-set-uri: http://localhost:8000/realms/api/protocol/openid-connect/certs

server:
  port: 8081
  shutdown: graceful

springdoc:
  swagger-ui:
    path: /docs

security:
  login-lockout:
    max-attempts: 5
    window-minutes: 15

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: HousiBackend
        environment: Local

http:
  clients:
    default-timeout: ${HTTP_CLIENTS_DEFAULT_TIMEOUT:5000}
    webhook-site:
      base-url: ${HTTP_CLIENTS_MY_EXTERNAL_API_BASE_URL:http://localhost}

slack:
  env: ${SLACK_ENV:}
  channels:
    api-alert:
      url: ${SLACK_API_ALERT_URL:}
      name: ${SLACK_API_ALERT_CHANNEL:}

rate-limit:
  default:
    name: ${DEFAULT_RATE_LIMIT_NAME:DEFAULT}
    max-requests: ${DEFAULT_MAX_REQUESTS:50}
    refill-in-seconds: ${DEFAULT_REFILL_IN_SECONDS:1}

kubernetes:
  service-name: ${KUBERNETES_SERVICE_NAME:backend-housi}

miscellaneous:
  max-response-time-to-log-in-ms: ${MAX_RESPONSE_TIME_TO_LOG_IN_MS:2000}
