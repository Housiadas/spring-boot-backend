# app
spring.application.name=backend
server.port=8081

# database
spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.username=myuser
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

## redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=5000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# Login lockout (Redis-backed)
security.login-lockout.max-attempts=5
security.login-lockout.window-minutes=15

# open api
springdoc.swagger-ui.path=/docs

# jwt
spring.jwt.secret=${JWT_SECRET:}
spring.jwt.expiration=900000

# logs
logging.structured.format.console=ecs
logging.structured.ecs.service.name=Backend
logging.structured.ecs.service.environment=Production

# misc
miscellaneous.max-response-time-to-log-in-ms=${MAX_RESPONSE_TIME_TO_LOG_IN_MS:2000}
